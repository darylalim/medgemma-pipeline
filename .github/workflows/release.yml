name: Release

on:
  push:
    tags: ["v*"]           # a pushed vX.Y.Z tag cuts the release; nothing else fires it
  workflow_dispatch:        # manual re-run against an existing tag (dispatch from the tag)

permissions:
  contents: write           # create a GitHub Release; nothing more (CI stays read-only)

concurrency:
  group: publish-release    # a literal, and concurrency groups are repository-wide, so
  cancel-in-progress: false # this is shared with tag-and-release.yml: the manual and
                            # automatic paths never publish at the same moment, and an
                            # in-flight publish is never interrupted

jobs:
  release:
    runs-on: ubuntu-latest  # no MLX here — just verify the version and call gh; the
    timeout-minutes: 10     # arm64/macOS parity that CI needs doesn't apply to publishing
    steps:
      - uses: actions/checkout@v5
        with:
          # Publishing goes through `gh` with GH_TOKEN from env, never through git, so
          # the checkout has no reason to leave a credential in .git/config.
          persist-credentials: false

      - name: Verify tag matches pyproject version
        # The tag is the release's identity; pyproject.version is the source of truth.
        # TAG comes in via env (never interpolated into the script — same injection guard
        # as CI), so a v0.7.6 tag pushed while pyproject still says 0.7.5 fails HERE
        # instead of publishing a release whose number lies about the code it points at.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match pyproject version $version (expected v$version)"
            exit 1
          fi

      - name: Create GitHub Release
        # Auto-generate notes from the conventional-commit history since the previous
        # tag — no hand-maintained CHANGELOG to drift. --verify-tag refuses a dangling tag.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Idempotent, because tag-and-release.yml may already have cut this version
          # automatically; a hand-pushed tag for an existing release should be a no-op,
          # not a red job.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG is already released — nothing to do"
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
