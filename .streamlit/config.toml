# Streamlit's frontend posts anonymous usage events to data.streamlit.io and a
# Fivetran webhook on every page load (browser.gatherUsageStats defaults to ON).
# Inference here is fully on-device and the README says so, which makes telemetry the
# largest outbound flow the app would have -- larger by far than the favicon fetch this
# config also avoids. Verified with Playwright: with this off, the page makes zero
# off-host requests. Guarded by TestThemeConfig.
[browser]
gatherUsageStats = false

# Nord theme — the arctic, north-bluish palette, applied as shipped in Streamlit's
# bundled `nord` template (frost accents #88c0d0/#81a1c1, aurora semantics).
#
# Deliberately a LONE [theme] block: Streamlit exposes the light/dark switch in the
# settings menu only when BOTH [theme.light] and [theme.dark] are defined, so keeping
# a single section locks the app to one mode and removes the toggle. `base = "dark"`
# seeds everything not overridden below from the dark built-in.
#
# The aurora colors are load-bearing rather than decorative: red/orange/green drive
# st.error / st.warning and the st.status phase badges the CT and Pathology tabs
# narrate their preprocessing with. All keys are validated against the installed
# Streamlit by TestThemeConfig.
#
# Nord's `font`/`codeFont` (Inter + JetBrains Mono, via a fonts.googleapis.com
# stylesheet) are DELIBERATELY omitted: inference here is fully on-device, and a
# webfont fetch would be the one outbound request the app makes on every page load.
# Streamlit's defaults -- Source Sans / Source Code, and the Material Symbols face
# behind every :material/icon: -- are served from the app's own static bundle, so
# leaving these keys unset keeps rendering local. Re-adding them re-adds the fetch.
[theme]
base = "dark"
primaryColor = "#88c0d0"
backgroundColor = "#2e3440"
secondaryBackgroundColor = "#3b4252"
codeBackgroundColor = "#3b4252"
textColor = "#eceff4"
linkColor = "#81a1c1"
borderColor = "#4c566a"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "4px"
buttonRadius = "4px"
codeFontSize = "0.875rem"
codeTextColor = "#d8dee9"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["32px", "24px", "20px", "16px", "14px", "12px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
linkUnderline = false
chartCategoricalColors = ["#88c0d0", "#81a1c1", "#5e81ac", "#a3be8c", "#ebcb8b", "#d08770", "#bf616a"]

# Nord color palette (Frost + Aurora)
blueColor = "#81a1c1"
greenColor = "#a3be8c"
yellowColor = "#ebcb8b"
orangeColor = "#d08770"
redColor = "#bf616a"
violetColor = "#b48ead"

# Inert in this app (no st.sidebar) — kept so the template stays faithful and a future
# sidebar inherits the palette instead of falling back to the built-in dark.
[theme.sidebar]
backgroundColor = "#3b4252"
secondaryBackgroundColor = "#434c5e"
codeBackgroundColor = "#434c5e"
borderColor = "#4c566a"
